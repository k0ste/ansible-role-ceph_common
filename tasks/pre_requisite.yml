---
- name: "ceph_common | Assert that ansible facts gathered successfully"
  ansible.builtin.assert:
    that:
      - "hostvars[inventory_hostname]['ansible_facts']['os_family'] is defined"
    fail_msg: "'ansible_facts' not found. Please enable facts gathering"
    quiet: "true"
- name: "ceph_common | Add the OS specific varibles"
  ansible.builtin.include_vars:
    file: "{{ hostvars[inventory_hostname]['ansible_facts']['os_family'] +
      '.yml' }}"
- name: "ceph_common | Set facts about ceph_common role"
  ansible.builtin.set_fact:
    ceph_common_systemd_dir: "/etc/systemd/system"
    ceph_common_package_state: "{{ lookup('ansible.builtin.vars',
      'ceph_common') | community.general.json_query('[].package_state | [0]') |
      default(omit) }}"
    ceph_common_systemd: "{{ lookup('ansible.builtin.vars', 'ceph_common') |
      community.general.json_query('[].systemd[] | [0]') | default(omit) }}"
    ceph_common_settings: "{{ lookup('ansible.builtin.vars', 'ceph_common') |
      community.general.json_query('[].settings[]') | default(omit) }}"
    ceph_common_keyrings_types: "{{ lookup('ansible.builtin.vars',
      'ceph_common') |
      community.general.json_query(\"[].keyrings[?type!='client'].type[]\") }}"
    ceph_common_keyrings_clients: "{{ lookup('ansible.builtin.vars',
      'ceph_common') |
      community.general.json_query(\"[].keyrings[?type=='client'][]\") }}"
    ceph_common_keyrings_workdir_bootstrap: "{{ lookup('ansible.builtin.vars',
      'ceph_common') |
      community.general.json_query(\"[].keyrings[?contains(type, `bootstrap`)]
      []\") }}"
    ceph_common_keyrings_workdir_apps: "{{ lookup('ansible.builtin.vars',
      'ceph_common') |
      community.general.json_query(\"[].keyrings[?contains(`[''mds'', ''mgr'',
      ''mon'', ''radosgw'']`, type)][]\") }}"
    ceph_common_rgw_certificate: "{{ lookup('ansible.builtin.vars',
      'ceph_common') |
      community.general.json_query('[].rgw_certificate | [0]') |
      default(omit) }}"
    ceph_common_exporter: "{{ lookup('ansible.builtin.vars', 'ceph_common') |
      community.general.json_query('[].exporter[]') | default(omit) }}"
    ceph_common_rbdmap: "{{ lookup('ansible.builtin.vars', 'ceph_common') |
      community.general.json_query('[].rbdmap[]') | default(omit) }}"
  when:
    - "lookup('ansible.builtin.vars', 'ceph_common', default='')
      not in ['', [], '[]', None]"
- name: "ceph_common | Assert that ceph_common package state in valid value"
  ansible.builtin.assert:
    that:
      - "lookup('ansible.builtin.vars', 'ceph_common_package_state') in
        ['present', 'latest']"
    fail_msg: "{{ 'package_state must be in `present` or `latest`,
      current is: ' + lookup('ansible.builtin.vars',
      'ceph_common_package_state') }}"
    quiet: "true"
  when:
    - "lookup('ansible.builtin.vars',
      'ceph_common_package_state', default='') not in ['', [], '[]', None,
      'present', 'latest']"
- name: "ceph_common | Set package state to 'present' cause value is not
    defined"
  ansible.builtin.set_fact:
    ceph_common_package_state: "present"
  when:
    - "lookup('ansible.builtin.vars',
      'ceph_common_package_state', default='') in ['', [], '[]', None]"
- name: "ceph_common | Import RGW cert checks"
  ansible.builtin.include_tasks:
    file: "prereq.d/rgw_cert_checks.yml"
  when:
    - "lookup('ansible.builtin.vars', 'ceph_common_rgw_certificate',
      default='') not in ['', [], '[]', None]"
- name: "ceph_common | Create conf.d catalogs"
  ansible.builtin.file:
    path: "{{ lookup('ansible.builtin.vars', 'ceph_common_conf_dest') }}"
    state: "directory"
    owner: "root"
    group: "root"
    mode: "0755"
- name: "ceph_common | Create Ceph working catalogs"
  ansible.builtin.file:
    path: "{{ lookup('ansible.builtin.vars', 'ceph_common_workdir_dest') }}"
    state: "directory"
    owner: "{{ lookup('ansible.builtin.vars', 'ceph_common_user_id') }}"
    group: "{{ lookup('ansible.builtin.vars', 'ceph_common_user_id') }}"
    mode: "0750"
- name: "ceph_common | Create Ceph working catalogs"
  ansible.builtin.file:
    path: "{{ lookup('ansible.builtin.vars', 'ceph_common_workdir_dest') ~ '/' ~
      ceph_dir }}"
    state: "directory"
    owner: "{{ lookup('ansible.builtin.vars', 'ceph_common_user_id') }}"
    group: "{{ lookup('ansible.builtin.vars', 'ceph_common_user_id') }}"
    mode: "0750"
  loop: "{{ lookup('ansible.builtin.vars', 'ceph_common_keyrings_types') |
    ansible.builtin.flatten(levels=1) }}"
  loop_control:
    loop_var: "ceph_dir"
    label: "{{ lookup('ansible.builtin.vars', 'ceph_common_workdir_dest') +
      '/' ~ ceph_dir }}"
  when:
    - "ceph_dir is defined"
    - "ceph_dir not in ['', [], '[]', None]"
- name: "ceph_common | Create override systemd service directory [ceph-mgr]"
  ansible.builtin.file:
    path: "{{ lookup('ansible.builtin.vars', 'ceph_common_systemd_dir') +
      '/ceph-mgr@.service.d' }}"
    state: "directory"
    group: "root"
    owner: "root"
    mode: "0755"
    recurse: "no"
  when:
    - "(lookup('ansible.builtin.vars', 'ceph_common_systemd')['mgr'] |
      default('')) not in ['', [], '[]', None]"
- name: "ceph_common | Create override systemd service directory
    [ceph-exporter]"
  ansible.builtin.file:
    path: "{{ lookup('ansible.builtin.vars', 'ceph_common_systemd_dir') +
      '/' + ceph_common_exporter_systemd_override }}"
    state: "directory"
    group: "root"
    owner: "root"
    mode: "0755"
    recurse: "no"
  # This loop for compat - Reef and Squid releases have a bug in service name,
  # that fixed in Tentacle release. So, for some time we should deploy in both
  # places. https://tracker.ceph.com/issues/74445
  loop:
    - 'ceph-exporter.service.d'
    - 'ceph-exporter@.service.d'
  loop_control:
    label: "{{ 'Create systemd override dir: ' + lookup('ansible.builtin.vars',
      'ceph_common_systemd_dir') + '/' +
      ceph_common_exporter_systemd_override }}"
    loop_var: 'ceph_common_exporter_systemd_override'
  notify:
    - "Daemon reload"
  when:
    - "lookup('ansible.builtin.vars', 'ceph_common_exporter', default='')
      not in ['', [], '[]', None]"
