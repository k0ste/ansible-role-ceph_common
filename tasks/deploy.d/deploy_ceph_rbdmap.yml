---
- name: "ceph_common | Deploy rbdmap image spec"
  ansible.builtin.template:
    src: "rbdmap.j2"
    dest: "{{ lookup('ansible.builtin.vars', 'ceph_common_conf_dest') +
      '/rbdmap' }}"
    force: "yes"
    owner: "root"
    group: "root"
    mode: "0644"
- name: "ceph_common | Enable rbdmap service"
  ansible.builtin.systemd:
    name: "rbdmap"
    enabled: "yes"
  when:
    - "lookup('ansible.builtin.vars', 'ceph_common', default='')
      not in ['', [], '[]', None]"
    - "lookup('ansible.builtin.vars', 'ceph_common') |
       community.general.json_query(lookup('ansible.builtin.vars',
       'ceph_common_rbdmap_enable', default='')) == 'true'"
  vars:
    ceph_common_rbdmap_enable: "[] | map(&rbdmap_enable || 'false', @) | [0]"
