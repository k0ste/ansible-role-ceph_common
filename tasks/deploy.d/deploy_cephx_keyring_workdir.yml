---
- name: "ceph_common | Create Ceph working catalogs for Ceph client apps"
  ansible.builtin.file:
    path: "{{ lookup('ansible.builtin.vars', 'ceph_common_workdir_dest') + '/' +
      cephx['type'] + '/ceph-' ~ cephx['name'] }}"
    state: "directory"
    owner: "{{ lookup('ansible.builtin.vars', 'ceph_common_user_id') }}"
    group: "{{ lookup('ansible.builtin.vars', 'ceph_common_user_id') }}"
    mode: "0750"
  loop: "{{ lookup('ansible.builtin.vars',
    'ceph_common_keyrings_workdir_apps') | ansible.builtin.flatten(levels=1) }}"
  loop_control:
    loop_var: "cephx"
    label: "{{ 'Dir: ' + lookup('ansible.builtin.vars',
      'ceph_common_workdir_dest') + '/' + cephx['type'] + '/ceph-' ~
      cephx['name'] }}"
  when:
    - "cephx['name'] is defined"
    - "cephx['name'] not in ['', [], '[]', None]"
- name: "ceph_common | Deploy cephx keyring for Ceph client apps"
  ansible.builtin.template:
    src: "cephx_keyring.j2"
    dest: "{{ lookup('ansible.builtin.vars', 'ceph_common_workdir_dest') + '/' +
      cephx['type'] + '/ceph-' ~ cephx['name'] ~ '/keyring' }}"
    force: "yes"
    owner: "{{ lookup('ansible.builtin.vars', 'ceph_common_user_id') }}"
    group: "{{ lookup('ansible.builtin.vars', 'ceph_common_user_id') }}"
    mode: "0400"
  loop: "{{ lookup('ansible.builtin.vars',
    'ceph_common_keyrings_workdir_apps') | ansible.builtin.flatten(levels=1) }}"
  loop_control:
    loop_var: "cephx"
    label: "{{ 'Keyring: ' +
      lookup('ansible.builtin.vars', 'ceph_common_workdir_dest') + '/' +
      cephx['type'] + '/ceph-' ~ cephx['name'] ~ '/keyring' }}"
  when:
    - "cephx['name'] is defined"
    - "cephx['name'] not in ['', [], '[]', None]"
- name: "ceph_common | Deploy cephx bootstrap keyring"
  ansible.builtin.template:
    src: "cephx_keyring.j2"
    dest: "{{ lookup('ansible.builtin.vars', 'ceph_common_workdir_dest') + '/' +
      cephx['type'] + '/ceph.keyring' }}"
    force: "yes"
    owner: "{{ lookup('ansible.builtin.vars', 'ceph_common_user_id') }}"
    group: "{{ lookup('ansible.builtin.vars', 'ceph_common_user_id') }}"
    mode: "0600"
  loop: "{{ lookup('ansible.builtin.vars',
    'ceph_common_keyrings_workdir_bootstrap') |
    ansible.builtin.flatten(levels=1) }}"
  loop_control:
    loop_var: "cephx"
    label: "{{ 'Keyring: ' + lookup('ansible.builtin.vars',
      'ceph_common_workdir_dest') + '/' + cephx['type'] + '/ceph.keyring' }}"
  when:
    - "cephx['name'] is defined"
    - "cephx['name'] not in ['', [], '[]', None]"
